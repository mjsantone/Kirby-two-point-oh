# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fuse-catterson

on:
  push:
    branches:
      - claude/metaball-canvas-fable-cmogul
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !FUSE_PITCH.md
            !fuse-portfolio-1792x1008.png
            !pitch-assets/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_24A9E4A809BF42B597B41D2162B855F1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E124E8C2AB53475EB75083EFBD523F8C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_ADBEE9FAA5354B878B7EFE6F0957881B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fuse-catterson'
          slot-name: 'Production'
          package: .

      - name: Restart Azure Web App worker
        run: az webapp restart --name fuse-catterson --resource-group fuse-rg
